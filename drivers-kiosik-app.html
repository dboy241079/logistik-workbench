<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <title>Fahrer Kiosk</title>
  <style>
    :root { color-scheme: light; }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #111315;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .device-shell {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border-radius: 0;
      background: #f7f7f8;
      box-shadow: none;
    }

    iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #f7f7f8;
    }

    /*
      Smartphone: Die echte Display-Kamera bleibt frei.
      Es wird KEINE Kamera gezeichnet. Stattdessen bekommt die weiße
      App-Fläche oben mittig eine dunkle, gebogene Aussparung.
    */
    @media (max-width: 575.98px) {
      .device-shell::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        z-index: 20;
        width: 68px;
        height: max(42px, calc(env(safe-area-inset-top) + 18px));
        transform: translateX(-50%);
        background: #111315;
        border-radius: 0 0 36px 36px;
        pointer-events: none;
      }

      iframe {
        top: 0;
        height: 100%;
      }
    }

    /* Tablet/Desktop: keine Kamera-Aussparung simulieren. */
    @media (min-width: 576px) {
      .device-shell::before { display: none; }
    }
  </style>
</head>
<body>
  <main class="device-shell" aria-label="Fahrer Kiosk App">
    <iframe id="driverKioskFrame" src="/drivers-kiosik.html" title="Fahrer Kiosk" loading="eager"></iframe>
  </main>

  <script>
    // drivers-kiosik.html liegt auf derselben Domain. Deshalb kann der mobile
    // Full-Width-Override sicher in das Dokument der WebView eingebunden werden,
    // ohne die umfangreiche Fahrer-/Stempellogik der Originaldatei zu verändern.
    const driverKioskFrame = document.getElementById('driverKioskFrame');

    driverKioskFrame.addEventListener('load', () => {
      try {
        const doc = driverKioskFrame.contentDocument;
        if (!doc || doc.getElementById('driversKioskMobileCss')) return;

        const link = doc.createElement('link');
        link.id = 'driversKioskMobileCss';
        link.rel = 'stylesheet';
        link.href = '/CSS/drivers-kiosik-mobile.css?v=20260814-3';
        doc.head.appendChild(link);
      } catch (err) {
        console.warn('Mobile Kiosk CSS konnte nicht eingebunden werden:', err);
      }
    });
  </script>
</body>
</html>
