<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <title>Fahrer Kiosk</title>
  <style>
    :root { color-scheme: light; }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #111315;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .device-shell {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border-radius: 0;
      background: #f7f7f8;
      box-shadow: none;
    }

    iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #f7f7f8;
    }

    /*
      Smartphone: Die echte Display-Kamera bleibt frei.
      Es wird KEINE Kamera gezeichnet. Stattdessen bekommt die weiße
      App-Fläche oben mittig eine dunkle, gebogene Aussparung.
    */
    @media (max-width: 575.98px) {
      .device-shell::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        z-index: 20;
        width: 68px;
        height: max(42px, calc(env(safe-area-inset-top) + 18px));
        transform: translateX(-50%);
        background: #111315;
        border-radius: 0 0 36px 36px;
        pointer-events: none;
      }

      iframe {
        top: 0;
        height: 100%;
      }
    }

    /* Tablet/Desktop: keine Kamera-Aussparung simulieren. */
    @media (min-width: 576px) {
      .device-shell::before { display: none; }
    }
  </style>
</head>
<body>
  <main class="device-shell" aria-label="Fahrer Kiosk App">
    <iframe id="driverKioskFrame" src="/drivers-kiosik.html" title="Fahrer Kiosk" loading="eager"></iframe>
  </main>

  <script>
    // drivers-kiosik.html liegt auf derselben Domain. Deshalb können die
    // Kiosk-spezifischen Ergänzungen sicher in die WebView eingebunden werden,
    // ohne die umfangreiche Fahrer-/Stempellogik der Originaldatei zu verändern.
    const driverKioskFrame = document.getElementById('driverKioskFrame');

    driverKioskFrame.addEventListener('load', () => {
      try {
        const doc = driverKioskFrame.contentDocument;
        if (!doc) return;

        if (!doc.getElementById('driversKioskMobileCss')) {
          const link = doc.createElement('link');
          link.id = 'driversKioskMobileCss';
          link.rel = 'stylesheet';
          link.href = '/CSS/drivers-kiosik-mobile.css?v=20260814-3';
          doc.head.appendChild(link);
        }

        if (!doc.getElementById('driversKioskLanguageCss')) {
          const style = doc.createElement('style');
          style.id = 'driversKioskLanguageCss';
          style.textContent = `
            .kiosk-language-row {
              display: flex;
              width: 100%;
              align-items: center;
              margin-bottom: .75rem;
            }

            .kiosk-language-left,
            .kiosk-language-right {
              width: 50%;
              min-width: 0;
            }

            .kiosk-language-right {
              display: flex;
              justify-content: center;
              align-items: center;
            }

            .kiosk-language-select {
              width: auto;
              min-width: 150px;
              max-width: 100%;
              text-align: left;
            }

            @media (max-width: 575.98px) {
              .kiosk-language-row {
                margin-bottom: .5rem;
              }

              .kiosk-language-select {
                min-width: 145px;
                font-size: .9rem;
              }
            }
          `;
          doc.head.appendChild(style);
        }

        if (!doc.getElementById('languageSelect')) {
          const ctrlForm = doc.getElementById('ctrlForm');
          const cardBody = ctrlForm?.parentElement;

          if (ctrlForm && cardBody) {
            const languageRow = doc.createElement('div');
            languageRow.className = 'kiosk-language-row';
            languageRow.innerHTML = `
              <div class="kiosk-language-left" aria-hidden="true"></div>
              <div class="kiosk-language-right">
                <select id="languageSelect" class="form-select form-select-sm kiosk-language-select" aria-label="Sprache auswählen">
                  <option value="de">🇩🇪 Deutsch</option>
                  <option value="en">🇬🇧 English</option>
                  <option value="pl">🇵🇱 Polski</option>
                </select>
              </div>
            `;
            cardBody.insertBefore(languageRow, ctrlForm);
          }
        }
      } catch (err) {
        console.warn('Kiosk-Erweiterungen konnten nicht eingebunden werden:', err);
      }
    });
  </script>
</body>
</html>
