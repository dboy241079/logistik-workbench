<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15171a">
  <title>Fahrer Kiosk</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:#15171a; }
    body {
      min-height:100dvh;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .device-shell {
      position:relative;
      width:min(100%, 860px);
      height:calc(100dvh - max(20px, env(safe-area-inset-top)) - max(20px, env(safe-area-inset-bottom)));
      margin:0 auto;
      overflow:hidden;
      border-radius:30px;
      background:#fff;
      box-shadow:0 18px 60px rgba(0,0,0,.34), inset 0 0 0 1px rgba(255,255,255,.06);
    }
    .camera-cutout {
      position:absolute;
      top:8px;
      left:50%;
      z-index:10;
      width:88px;
      height:24px;
      transform:translateX(-50%);
      border-radius:999px;
      background:#0b0d0f;
      pointer-events:none;
      box-shadow:inset 0 -1px 0 rgba(255,255,255,.08);
    }
    .camera-cutout::after {
      content:"";
      position:absolute;
      right:12px;
      top:8px;
      width:8px;
      height:8px;
      border-radius:50%;
      background:#202b39;
      box-shadow:0 0 0 2px #050607;
    }
    iframe {
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:#f7f7f8;
    }
    @media (min-width: 576px) {
      body { padding:16px; background:#f7f7f8; }
      .device-shell {
        height:calc(100dvh - 32px);
        border-radius:18px;
        box-shadow:0 8px 28px rgba(0,0,0,.10);
      }
      .camera-cutout { display:none; }
    }
    @media (min-width: 992px) {
      body { padding:0; }
      .device-shell {
        width:100%;
        max-width:none;
        height:100dvh;
        border-radius:0;
        box-shadow:none;
      }
    }
  </style>
</head>
<body>
  <main class="device-shell" aria-label="Fahrer Kiosk App">
    <div class="camera-cutout" aria-hidden="true"></div>
    <iframe src="/drivers-kiosik.html" title="Fahrer Kiosk" loading="eager"></iframe>
  </main>
</body>
</html>
